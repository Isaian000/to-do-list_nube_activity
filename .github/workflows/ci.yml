name: CI

# pruebas en cada pr a main
# para bloquear el merge exige el check "tests" en la proteccion de main
on:
  pull_request:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
          cache: pip
          cache-dependency-path: app/requirements*.txt

      - run: pip install -r requirements-dev.txt

      - run: pytest -v

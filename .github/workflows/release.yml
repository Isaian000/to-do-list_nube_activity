name: Release

# tag v#.#.# -> release con zip del repo -> deploy
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

jobs:
  tests:
    uses: ./.github/workflows/ci.yml

  release:
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Comprimir repositorio
        run: git archive --format=zip -o "to-do-list-api-${GITHUB_REF_NAME}.zip" "$GITHUB_REF_NAME"

      - name: Crear release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "to-do-list-api-${GITHUB_REF_NAME}.zip" \
            --title "$GITHUB_REF_NAME" --generate-notes

  # un release hecho con github_token no dispara otros workflows, se llama directo
  deploy:
    needs: release
    uses: ./.github/workflows/deploy.yml
    with:
      tag: ${{ github.ref_name }}
    secrets: inherit

name: Infra - destroy

# manual: actions > infra - destroy > run workflow
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Escribe "destroy" para confirmar'
        required: true

permissions:
  contents: read

concurrency:
  group: terraform
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
  TF_VAR_region: us-east-1
  TF_VAR_public_key: ${{ secrets.SSH_PUBLIC_KEY }}
  TF_VAR_repo_url: https://github.com/${{ github.repository }}.git
  TF_VAR_repo_branch: ${{ github.event.repository.default_branch }}

jobs:
  destroy:
    if: inputs.confirm == 'destroy'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.5
          terraform_wrapper: false

      - name: terraform init
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          terraform init -input=false \
            -backend-config="bucket=to-do-list-tfstate-${ACCOUNT_ID}" \
            -backend-config="key=to-do-list/terraform.tfstate" \
            -backend-config="region=${AWS_REGION}" \
            -backend-config="encrypt=true" \
            -backend-config="use_lockfile=true"

      - name: terraform destroy
        run: terraform destroy -input=false -auto-approve
